  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background: var(--bg); color: var(--text);
    font-family: var(--font-body); line-height:1.45;
    overflow:hidden; position:fixed; inset:0; width:100%;
    -webkit-user-select:none; user-select:none;
    display:flex; flex-direction:column;
  }
  button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
  input{ font-family:inherit; }
  svg{ display:block; }
  p{ margin:0; }

  /* ---------- Header ---------- */
  header{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: max(16px, var(--safe-t)) 20px 10px;
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-dot{ width:9px; height:9px; border-radius:50%; background: var(--green); box-shadow:0 0 10px var(--green); flex:none; }
  .brand-logo{
    width:34px; height:22px; flex:none;
    background-image: var(--logo-url); background-size:contain; background-repeat:no-repeat; background-position:center;
    filter: drop-shadow(0 0 6px rgba(0,255,135,.35));
  }
  .brand-title{ font-family: var(--font-display); font-weight:800; font-size:18px; letter-spacing:-.01em; }

  .icon-btn{
    width:44px; height:44px; border-radius:14px;
    background: var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted);
    transition: transform .12s ease, background .12s ease, color .12s ease;
    flex-shrink:0;
  }
  .icon-btn svg{ width:20px; height:20px; }
  .icon-btn:active{ transform: scale(.9); background: var(--surface-raised); color: var(--text); }
  #btnSync.syncing svg{ animation: spin .8s linear infinite; color: var(--amber); }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- Segmented tab control (Cámara / Teclado / Buscar) ---------- */
  .segwrap{ padding: 0 20px 10px; flex-shrink:0; }
  .segmented{
    display:flex; gap:4px; background: var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:5px;
  }
  .seg-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    height:44px; border-radius:999px; color: var(--text-muted);
    font-family: var(--font-display); font-weight:700; font-size:12.5px;
    transition: background .18s ease, color .18s ease, transform .12s ease;
  }
  .seg-btn svg{ width:18px; height:18px; }
  .seg-btn.active{ background: var(--green); color: var(--navy); box-shadow:0 6px 18px rgba(0,255,135,.3); }
  .seg-btn:active{ transform: scale(.95); }
  .seg-label{ display:none; }
  .seg-btn.active .seg-label{ display:inline; }

  .status-line{
    padding: 0 22px 12px; flex-shrink:0;
    display:flex; align-items:center; gap:7px;
    font-family: var(--font-mono); font-size:11.5px; color: var(--text-muted);
  }
  .status-line .dot{ width:6px; height:6px; border-radius:50%; background: var(--green); flex:none; }
  .status-line.err .dot{ background: var(--danger); }

  main{ flex:1; min-height:0; position:relative; }
  .view{ display:none; position:absolute; inset:0; flex-direction:column; overflow-y:auto; padding: 4px 20px 28px; }
  .view.active{ display:flex; }

  /* ---------- Búsqueda ---------- */
  .search-box{
    display:flex; align-items:center; gap:10px;
    background: var(--surface); border:1px solid var(--line); border-radius:999px;
    padding: 0 18px; height:52px; margin-bottom:16px; flex-shrink:0;
  }
  .search-box svg{ width:19px; height:19px; color: var(--text-muted); flex:none; }
  .search-box input{
    flex:1; background:none; border:none; outline:none; color: var(--text);
    font-size:14.5px;
  }
  .search-box input::placeholder{ color: var(--text-muted); }

  .result-list{ display:flex; flex-direction:column; gap:10px; }
  .result-card{
    display:flex; align-items:center; gap:13px;
    background: linear-gradient(160deg, var(--surface-raised), var(--surface));
    border:1px solid var(--line); border-radius: var(--radius-md);
    padding:13px 14px; text-align:left;
    transition: transform .12s ease, border-color .12s ease;
  }
  .result-card:active{ transform: scale(.98); border-color: var(--green-border); }
  .result-avatar{
    width:44px; height:44px; border-radius:14px; flex:none;
    background: var(--green-soft); color: var(--green);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:800; font-size:16px;
  }
  .result-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .result-name{ font-family: var(--font-display); font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result-sub{ display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--text-muted); white-space:nowrap; overflow:hidden; }
  .result-sub .result-id{ font-family:'SF Mono','Consolas',monospace; letter-spacing:.2px; background: rgba(255,255,255,.06); border:1px solid var(--line); border-radius:5px; padding:1.5px 6px; flex:none; }
  .result-sub .result-date{ overflow:hidden; text-overflow:ellipsis; }
  .result-chevron{ width:18px; height:18px; color: var(--text-muted); flex:none; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:60px 24px; color: var(--text-muted);
  }
  .empty-state svg{ width:40px; height:40px; color: var(--text-muted); opacity:.6; }
  .empty-state p{ font-size:13.5px; max-width:240px; line-height:1.5; }

  /* ---------- Teclado (entrada manual) ---------- */
  #view-teclado{ align-items:center; justify-content:center; text-align:center; gap:16px; }
  .kbd-input{
    width:100%; max-width:300px; height:58px; border-radius:999px;
    background: var(--surface); border:1px solid var(--line); color: var(--text);
    text-align:center; font-family: var(--font-mono); font-size:15px; letter-spacing:.06em;
    outline:none; padding:0 20px;
  }
  .kbd-input::placeholder{ color: var(--text-muted); letter-spacing:normal; font-family: var(--font-body); }
  .kbd-hint{ font-size:12.5px; color: var(--text-muted); max-width:260px; line-height:1.5; }

  /* ---------- Botones (identidad) ---------- */
  .btn{
    cursor:pointer; border:none; border-radius:100px; font-weight:700;
    transition: transform .25s, box-shadow .25s, border-color .25s, background .25s;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family: var(--font-display); letter-spacing:.04em;
  }
  .btn:active{ transform: scale(.96); }
  .btn svg{ width:20px; height:20px; flex-shrink:0; }
  .btn-lg{ height:58px; padding:0 26px; font-size:15.5px; width:100%; max-width:300px; }
  .btn-primary{ background: var(--green); color: var(--navy); box-shadow: 0 8px 32px rgba(0,255,135,.35); }
  .btn-primary:disabled{ opacity:.55; box-shadow:none; }
  .btn-ghost{ background:transparent; color: var(--white); font-weight:600; border:1.5px solid rgba(255,255,255,.25); }
  .btn-ghost:active{ background: rgba(255,255,255,.06); }

  /* ---------- Cámara ---------- */
  #view-camara{ padding:0; align-items:center; justify-content:center; background:#000; position:relative; }
  .video-wrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #video{ width:100%; height:100%; object-fit:cover; }
  .viewfinder{
    position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    width:230px; height:230px; border-radius:24px; pointer-events:none;
  }
  .viewfinder .corner{ position:absolute; width:28px; height:28px; border-color: var(--green); opacity:.95; }
  .viewfinder .corner.tl{ top:0; left:0; border-top:3px solid; border-left:3px solid; border-radius:12px 0 0 0; }
  .viewfinder .corner.tr{ top:0; right:0; border-top:3px solid; border-right:3px solid; border-radius:0 12px 0 0; }
  .viewfinder .corner.bl{ bottom:0; left:0; border-bottom:3px solid; border-left:3px solid; border-radius:0 0 0 12px; }
  .viewfinder .corner.br{ bottom:0; right:0; border-bottom:3px solid; border-right:3px solid; border-radius:0 0 12px 0; }
  .cam-hint{
    position:absolute; bottom: max(30px, var(--safe-b)); left:0; right:0; text-align:center;
    font-family: var(--font-mono); font-size:12px; letter-spacing:.05em; color:#fff; opacity:.85;
  }
  .cam-error{
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    text-align:center; padding:32px 24px; color: var(--text); background: var(--surface); height:100%; width:100%;
  }
  .cam-error.show{ display:flex; }
  .cam-error svg{ width:38px; height:38px; color: var(--danger); }
  .cam-error p{ color: var(--text-muted); font-size:13px; max-width:280px; line-height:1.5; }

  /* ---------- Tarjeta de suscriptor (overlay) ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(0,0,0,.62); z-index:80;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:relative; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; overflow-x:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(0,255,135,.08), transparent 55%),
      linear-gradient(180deg, var(--card-bg-1) 0%, var(--card-bg-2) 100%);
    border:1px solid rgba(255,255,255,.10); border-top:none; border-radius: 32px 32px 0 0;
    padding: 0 22px calc(30px + var(--safe-b));
    box-shadow: 0 -30px 80px -20px rgba(0,0,0,.65);
    transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.9,.3,1);
  }
  .sheet::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: var(--hairline); background-size:200% 100%;
    border-radius: 32px 32px 0 0;
  }
  .overlay.show .sheet::before{ animation: sheen 1.4s ease-out .15s both; }
  @keyframes sheen{ 0%{ background-position: 120% 0; opacity:.4; } 55%{ opacity:1; } 100%{ background-position:-20% 0; opacity:1; } }
  .overlay.show .sheet{ transform: translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:999px; background: rgba(255,255,255,.16); margin:14px auto 6px; }
  .sheet.capturing .close-x,
  .sheet.capturing .sheet-handle,
  .sheet.capturing .card-actions{ visibility:hidden; }

  .card-watermark{
    position:absolute; left:50%; top:120px; transform:translateX(-50%);
    width:260px; height:150px;
    background: var(--logo-url) center/contain no-repeat;
    opacity:.05; pointer-events:none; z-index:-1;
  }
  .card-avatar{
    width:66px; height:66px; border-radius:20px; margin:2px auto 16px;
    background:
      var(--logo-url) center/62% no-repeat,
      linear-gradient(160deg, rgba(0,255,135,.14), rgba(0,255,135,.03));
    border:1px solid var(--seal-line);
    box-shadow: 0 10px 24px -14px rgba(0,255,135,.4);
  }

  .card-name{ text-align:center; font-family: var(--font-display); font-weight:800; font-size:20px; letter-spacing:-.01em; margin-bottom:8px; }
  .card-plan-row{ display:flex; align-items:center; justify-content:center; margin-bottom:24px; }
  .card-plan{
    display:inline-flex; align-items:center; gap:6px;
    font-family: var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.05em; color: var(--ink-mono);
    background: rgba(0,255,135,.07); border:1px solid var(--seal-line); border-radius:999px; padding:6px 14px;
  }
  .card-plan-dot{ width:5px; height:5px; border-radius:50%; background: var(--green); box-shadow:0 0 6px var(--green); flex:none; }

  .qr-zone{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:2px 0 10px; }
  .qr-seal{
    position:relative; padding:20px; border-radius:22px; display:none;
    background: radial-gradient(120% 120% at 50% 20%, rgba(0,255,135,.14), transparent 60%);
  }
  .qr-seal.show{ display:inline-flex; }
  .qr-seal::before{
    content:''; position:absolute; inset:6px; border-radius:16px; border:1px solid var(--seal-line); pointer-events:none;
  }
  .qr-seal .corner{ position:absolute; width:16px; height:16px; border-color: var(--green); }
  .qr-seal .corner.tl{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; border-radius:10px 0 0 0; }
  .qr-seal .corner.tr{ top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; border-radius:0 10px 0 0; }
  .qr-seal .corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; border-radius:0 0 0 10px; }
  .qr-seal .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; border-radius:0 0 10px 0; }
  #qrBox{ background:#fff; padding:12px; border-radius:14px; position:relative; box-shadow:0 12px 30px -10px rgba(0,0,0,.5); }
  .qr-caption{
    display:flex; align-items:center; gap:6px;
    font-family: var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color: var(--text-muted);
  }
  .qr-caption svg{ width:11px; height:11px; color: var(--green); flex:none; }

  /* ---------- Tarjeta de exportación (imagen descargable) ---------- */
  .export-card{
    position:fixed; left:-9999px; top:0; width:420px;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(0,255,135,.09), transparent 55%),
      linear-gradient(180deg, var(--card-bg-1) 0%, var(--card-bg-2) 100%);
    border:1px solid rgba(255,255,255,.10); border-radius:36px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.65);
    padding:44px 36px 32px; text-align:center;
  }
  .export-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: var(--hairline); border-radius:36px 36px 0 0;
  }
  .export-card .card-watermark{ top:150px; }
  .export-card .card-avatar{ margin:0 auto 18px; }
  .export-card .card-name{ font-size:22px; margin-bottom:10px; }
  .export-card .card-plan-row{ margin-bottom:28px; }
  .export-card .qr-seal{ margin:0 auto; }
  .export-footer{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:26px; padding-top:20px; border-top:1px solid var(--line);
    font-family: var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color: var(--text-muted);
  }
  .export-footer-logo{
    width:20px; height:14px; flex:none;
    background-image: var(--logo-url); background-size:contain; background-repeat:no-repeat; background-position:center;
  }

  .card-actions{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:6px; }
  .card-actions .btn-row{ display:flex; gap:10px; width:100%; max-width:300px; }
  .card-actions .btn-row .btn{ flex:1; height:50px; font-size:13.5px; }

  /* ---------- Botones redondos (icono arriba + etiqueta abajo) ---------- */
  .round-btn-row{ display:flex; align-items:flex-start; justify-content:center; gap:14px; }
  .round-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    width:96px; height:96px; border-radius:24px; flex-shrink:0; position:relative;
    background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border:1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 24px -14px rgba(0,0,0,.7);
    transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .round-btn:active{ transform: scale(.94); background: rgba(255,255,255,.08); }
  .round-btn:disabled{ opacity:.5; }
  .round-btn.primary{
    border-color: var(--seal-line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 14px 28px -12px rgba(0,255,135,.3);
  }
  .round-btn svg{ width:23px; height:23px; color: var(--green); flex-shrink:0; }
  .round-btn-label{
    font-family: var(--font-mono); font-weight:600; font-size:9.5px;
    letter-spacing:.09em; text-transform:uppercase; color: var(--ink-mono);
  }

  .close-x{
    position:absolute; top:16px; right:18px; width:34px; height:34px; border-radius:11px; z-index:2;
    background: rgba(255,255,255,.04); border:1px solid var(--line); color: var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    transition: background .12s ease, color .12s ease, transform .12s ease;
  }
  .close-x:active{ transform: scale(.9); background: rgba(255,255,255,.09); color: var(--text); }
  .close-x svg{ width:15px; height:15px; }
  .sheet{ position:relative; }

  /* Toast */
  #toast{
    position:fixed; left:20px; right:20px; top: calc(max(16px, var(--safe-t)) + 66px); z-index:100;
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius: var(--radius-md);
    background: var(--surface-raised); border:1px solid var(--line);
    box-shadow: 0 20px 50px -18px rgba(0,0,0,.75);
    transform: translateY(-140%); opacity:0; pointer-events:none;
    transition: transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
    font-size:14px; font-weight:600; color: var(--ok);
  }
  #toast.show{ transform:none; opacity:1; }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-logo"></span>
      <span class="brand-title">Creador QR</span>
    </div>
    <button id="btnSync" class="icon-btn" onclick="cargarDatos()" title="Sincronizar" aria-label="Sincronizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>
  </header>

  <div class="segwrap">
    <div class="segmented">
      <button class="seg-btn" id="tabCamara" onclick="cambiarTab('camara')" aria-label="Cámara">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span class="seg-label">Cámara</span>
      </button>
      <button class="seg-btn" id="tabTeclado" onclick="cambiarTab('teclado')" aria-label="Teclado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>
        <span class="seg-label">Teclado</span>
      </button>
      <button class="seg-btn active" id="tabBuscar" onclick="cambiarTab('buscar')" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <span class="seg-label">Buscar</span>
      </button>
    </div>
  </div>

  <div class="status-line" id="statusLine"><span class="dot"></span><span id="statusText">Cargando...</span></div>

  <main>
    <!-- ============ TAB: BUSCAR ============ -->
    <section class="view active" id="view-buscar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="buscador" placeholder="Buscar por nombre, celular o ID..." oninput="filtrar()">
      </div>
      <div class="result-list" id="resultList"></div>
    </section>

    <!-- ============ TAB: TECLADO ============ -->
    <section class="view" id="view-teclado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="42" height="42" style="color:var(--amber)"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>
      <input type="text" class="kbd-input" id="idManual" placeholder="Ingresá el Id_Susc" autocomplete="off">
      <button class="btn btn-primary btn-lg" onclick="buscarPorIdManual()">Buscar suscriptor</button>
      <p class="kbd-hint">Escribí el código exacto de suscripción para abrir la tarjeta del cliente.</p>
    </section>

    <!-- ============ TAB: CÁMARA ============ -->
    <section class="view" id="view-camara">
      <div class="video-wrap">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="viewfinder" id="viewfinder">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
        <p class="cam-hint">Apuntá al QR o código impreso del suscriptor</p>
      </div>
      <div class="cam-error" id="cameraError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <p id="cameraErrorMsg">No se pudo acceder a la cámara. Probá con la búsqueda o el teclado.</p>
      </div>
    </section>
  </main>

  <!-- ============ TARJETA DE SUSCRIPTOR ============ -->
  <div class="overlay" id="cardOverlay">
    <div class="sheet" id="sheetCard">
      <button class="close-x" id="closeX" onclick="cerrarCard()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="sheet-handle"></div>
      <div class="card-watermark"></div>

      <div class="card-avatar" id="cardAvatarWrap"></div>
      <p class="card-name" id="cardNombre">-</p>
      <div class="card-plan-row">
        <span class="card-plan"><span class="card-plan-dot"></span><span id="cardPlan">-</span></span>
      </div>

      <div class="qr-zone">
        <div class="qr-seal" id="qrSeal">
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
          <div id="qrBox"></div>
        </div>
        <div class="qr-caption" id="qrCaption" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Código verificado
        </div>
        <div class="card-actions">
          <div class="round-btn-row" id="crearQRRow">
            <button class="round-btn primary" id="btnCrearQR" onclick="crearQR()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 14h3v3M14 18h3v3M18 18h3v3"/></svg>
              <span class="round-btn-label">Crear QR</span>
            </button>
          </div>
          <div class="round-btn-row" id="qrDoneActions" style="display:none;">
            <button class="round-btn primary" onclick="descargarQR()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
              <span class="round-btn-label">Descargar</span>
            </button>
            <button class="round-btn" onclick="cerrarCard()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <span class="round-btn-label">Cerrar</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Plantilla oculta usada SOLO para generar la imagen de descarga: bordes
       redondeados en las 4 esquinas y espaciados más generosos que el bottom-sheet. -->
  <div class="export-card" id="exportCard">
    <div class="card-watermark"></div>
    <div class="card-avatar"></div>
    <p class="card-name" id="exNombre">-</p>
    <div class="card-plan-row">
      <span class="card-plan"><span class="card-plan-dot"></span><span id="exPlan">-</span></span>
    </div>
    <div class="qr-seal show" id="exQrSeal">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div id="exQrBox"></div>
    </div>
    <div class="export-footer">
      <span class="export-footer-logo"></span>
      <span>TUM · Acceso verificado</span>
    </div>
  </div>

  <div id="toast"></div>

<script>
  // ⚠️ URL de tu implementación de Apps Script (backend / API).
  const API_URL = 'https://script.google.com/macros/s/AKfycbwPH95X8dhCYYMX0oaddDSPCp_xDOhJAeRrSXs6Z23mlTFxl2lOVhCJIrl9AQR5os4j/exec';

  const CACHE_KEY = 'susc_cache_v1';
  const SYNC_TIME_KEY = 'susc_last_sync_v1';
  // Separador usado para unir Id_Susc + S_Fecha_Registro dentro del QR.
  // Debe ser EXACTAMENTE el mismo separador que usa el Escáner al leer el QR.
  const QR_SEPARADOR = '|';
  let suscripciones = [];
  let idActual = '';
  let fechaRegistroActual = '';
  let tabActual = 'buscar';

  let videoStream = null;
  let scanTimer = null;
  let scanning = false;

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(()=> t.classList.remove('show'), 2400);
  }

  function setStatus(msg, tipo){
    document.getElementById('statusText').textContent = msg;
    document.getElementById('statusLine').className = 'status-line' + (tipo ? ' ' + tipo : '');
  }

  function mostrarUltimaSync(){
    const t = localStorage.getItem(SYNC_TIME_KEY);
    if (!t) return;
    const f = new Date(parseInt(t,10));
    setStatus('Catálogo actualizado · ' + f.toLocaleDateString() + ', ' + f.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' · ' + suscripciones.length + ' suscripciones', 'ok');
  }

  window.addEventListener('DOMContentLoaded', function(){
    const cache = localStorage.getItem(CACHE_KEY);
    if (cache) {
      try {
        suscripciones = JSON.parse(cache);
        render(suscripciones);
        mostrarUltimaSync();
      } catch(e) { setStatus('Primera vez: se necesita sincronizar.', 'err'); cargarDatos(); return; }
    } else {
      setStatus('Primera vez: se necesita sincronizar.', 'err');
      cargarDatos();
    }
  });

  function cargarDatos(){
    const btn = document.getElementById('btnSync');
    btn.classList.add('syncing');
    setStatus('Sincronizando...');

    const callbackName = 'jsonpCallback_' + Date.now();
    const script = document.createElement('script');

    const timeout = setTimeout(function(){
      setStatus('No se pudo sincronizar (tiempo agotado).', 'err');
      btn.classList.remove('syncing');
      limpiarJsonp();
    }, 15000);

    function limpiarJsonp(){
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data){
      clearTimeout(timeout);
      suscripciones = data;
      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(SYNC_TIME_KEY, String(Date.now()));
      render(suscripciones);
      mostrarUltimaSync();
      btn.classList.remove('syncing');
      showToast(data.length + ' suscripciones sincronizadas');
      limpiarJsonp();
    };

    script.src = API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') + 'callback=' + callbackName;
    script.onerror = function(){
      clearTimeout(timeout);
      setStatus('Sin conexión a la API. Usando datos locales.', 'err');
      btn.classList.remove('syncing');
      limpiarJsonp();
    };

    document.body.appendChild(script);
  }

  function val(v){ return (v === undefined || v === null || v === '') ? '-' : v; }

  function iniciales(nombre){
    const n = (nombre || '?').trim();
    if (!n || n === '?') return '?';
    const partes = n.split(/\s+/);
    return ((partes[0][0]||'') + (partes[1] ? partes[1][0] : '')).toUpperCase();
  }

  function render(lista){
    const box = document.getElementById('resultList');
    if (!lista.length){
      box.innerHTML = '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>' +
        '<p>No hay suscriptores para mostrar. Probá sincronizar o cambiar la búsqueda.</p></div>';
      return;
    }
    box.innerHTML = lista.map(function(s){
      const idSusc = val(s.Id_Susc);
      const fecha = s.S_Fecha_Registro || ''; // se muestra tal cual llega de la API, sin modificar
      return '<button class="result-card" onclick="abrirCard(\'' + String(s.Id_Susc).replace(/'/g,"\\'") + '\')">' +
        '<span class="result-avatar">' + iniciales(s.RU_Nombre) + '</span>' +
        '<span class="result-info">' +
          '<span class="result-name">' + val(s.RU_Nombre) + '</span>' +
          '<span class="result-sub">' +
            '<span class="result-id">' + idSusc + '</span>' +
            (fecha ? '<span class="result-date">· ' + fecha + '</span>' : '') +
          '</span>' +
        '</span>' +
        '<svg class="result-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
        '</button>';
    }).join('');
  }

  function filtrar(){
    const q = document.getElementById('buscador').value.toLowerCase().trim();
    if (!q){ render(suscripciones); return; }
    const filtradas = suscripciones.filter(function(s){
      return (String(s.Id_Susc||'').toLowerCase().includes(q)) ||
             (String(s.RU_Nombre||'').toLowerCase().includes(q)) ||
             (String(s.RU_Celular||'').toLowerCase().includes(q));
    });
    render(filtradas);
  }

  /* ---------- Tabs ---------- */
  function cambiarTab(tab){
    tabActual = tab;
    ['camara','teclado','buscar'].forEach(function(t){
      document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
      document.getElementById('view-' + t).classList.toggle('active', t === tab);
    });
    if (tab === 'camara') { abrirCamara(); } else { detenerCamara(); }
  }

  /* ---------- Búsqueda manual por teclado ---------- */
  function buscarPorIdManual(){
    const id = document.getElementById('idManual').value.trim();
    if (!id) { showToast('Ingresá un Id_Susc'); return; }
    const s = suscripciones.find(function(x){ return String(x.Id_Susc) === id; });
    if (!s) { showToast('No se encontró ese Id_Susc'); return; }
    abrirCard(id);
  }

  /* ---------- Cámara (jsQR) ---------- */
  function abrirCamara(){
    document.getElementById('cameraError').classList.remove('show');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(stream){
        videoStream = stream;
        const video = document.getElementById('video');
        video.srcObject = stream;
        video.play();
        scanning = true;
        requestAnimationFrame(tick);
      })
      .catch(function(){
        document.getElementById('cameraError').classList.add('show');
      });
  }

  function detenerCamara(){
    scanning = false;
    if (videoStream){
      videoStream.getTracks().forEach(function(t){ t.stop(); });
      videoStream = null;
    }
  }

  function tick(){
    if (!scanning) return;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR(imgData.data, imgData.width, imgData.height);
      if (code && code.data){
        // El QR ahora trae Id_Susc + QR_SEPARADOR + S_Fecha_Registro; para buscar
        // al suscriptor en esta pantalla alcanza con la primera parte (el Id_Susc).
        const idLeido = String(code.data).split(QR_SEPARADOR)[0];
        const s = suscripciones.find(function(x){ return String(x.Id_Susc) === idLeido; });
        if (s){
          detenerCamara();
          abrirCard(idLeido);
          cambiarTab('buscar');
          return;
        }
      }
    }
    requestAnimationFrame(tick);
  }

  /* ---------- Tarjeta de suscriptor ---------- */
  function abrirCard(idSusc){
    const s = suscripciones.find(function(x){ return String(x.Id_Susc) === String(idSusc); });
    if (!s) { showToast('No se encontró el suscriptor'); return; }
    idActual = idSusc;
    fechaRegistroActual = s.S_Fecha_Registro || '';

    document.getElementById('cardNombre').textContent = s.RU_Nombre || 'Sin nombre';
    document.getElementById('cardPlan').textContent = s.RPL_Descripcion || '-';

    const qrBox = document.getElementById('qrBox');
    qrBox.innerHTML = '';
    document.getElementById('qrSeal').classList.remove('show');
    document.getElementById('qrCaption').style.display = 'none';
    document.getElementById('crearQRRow').style.display = 'flex';
    document.getElementById('qrDoneActions').style.display = 'none';

    document.getElementById('cardOverlay').classList.add('show');
  }

  function cerrarCard(){
    document.getElementById('cardOverlay').classList.remove('show');
  }

  function crearQR(){
    if (!fechaRegistroActual) {
      showToast('Atención: este suscriptor no tiene S_Fecha_Registro cargada. El QR se generará igual, pero con menos seguridad.');
    }
    const qrBox = document.getElementById('qrBox');
    qrBox.innerHTML = '';
    // Contenido "seguro" del QR: Id_Susc + S_Fecha_Registro unidos por QR_SEPARADOR.
    // Así, alguien que solo adivine o copie el Id_Susc no puede generar un QR válido
    // sin conocer también la fecha de registro real de ese suscriptor.
    const contenidoQR = idActual + QR_SEPARADOR + fechaRegistroActual;
    new QRCode(qrBox, {
      text: contenidoQR,
      width: 200,
      height: 200,
      colorDark: '#0f172a',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    document.getElementById('qrSeal').classList.add('show');
    document.getElementById('qrCaption').style.display = 'flex';
    document.getElementById('crearQRRow').style.display = 'none';
    document.getElementById('qrDoneActions').style.display = 'flex';
  }

  function descargarQR(){
    const qrBox = document.getElementById('qrBox');
    const exportCard = document.getElementById('exportCard');
    const exQrBox = document.getElementById('exQrBox');
    const originalParent = qrBox.parentElement;
    const originalNextSibling = qrBox.nextSibling;

    // Rellena la plantilla de exportación con los mismos datos visibles en la tarjeta
    document.getElementById('exNombre').textContent = document.getElementById('cardNombre').textContent;
    document.getElementById('exPlan').textContent = document.getElementById('cardPlan').textContent;

    // Mueve el QR real (canvas/img) dentro de la plantilla de exportación
    exQrBox.appendChild(qrBox);

    html2canvas(exportCard, {
      backgroundColor: null,
      scale: 3,
      useCORS: true,
      logging: false
    }).then(function(canvas){
      // Devuelve el QR a su lugar original en la tarjeta visible
      originalParent.insertBefore(qrBox, originalNextSibling);
      const a = document.createElement('a');
      a.download = 'Tarjeta_TUM_' + idActual + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }).catch(function(err){
      originalParent.insertBefore(qrBox, originalNextSibling);
      console.error('Error al generar la imagen de la tarjeta:', err);
    });
  }
</script>
</body>
</html>
